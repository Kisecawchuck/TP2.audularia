name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
  

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      with:
          # Optional: Specify version (defaults to latest release)
          ffmpeg-version: 'release' 
          # Automatically uses GitHub token to prevent rate limiting
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
    - name: make
      run: make
    - name: make run
      run: make run
    - name: make test
      run: make test
    - name: make install
      run: make install
    - name: make clean
      run: make clean
